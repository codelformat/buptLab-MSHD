<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>简单地图</title>
    <script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY"></script>
    <style>
      #mapContainer {
        width: 100%;
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div id="mapContainer"></div>
    <script>
      var map = new AMap.Map('mapContainer', {
        center: [116.397428, 39.90923],
        zoom: 13,
      });
    </script>
  </body>
</html>
